    function esc(value){return String(value).replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));}
    function flagHtml(code,cls){const svg=FLAG_SVG[code]||'';const label=(COUNTRIES[code]&&COUNTRIES[code].label)||code;return '<span class="'+(cls||'flag')+'" role="img" aria-label="'+esc(label)+'">'+svg+'</span>';}

    const recordingsTab=document.getElementById('tab-recordings');

    const tabs=Array.from(document.querySelectorAll('[role="tab"]')).filter(tab=>!tab.hidden);
    function openTab(name,focus=true,updateUrl=true){
      const target=document.getElementById('tab-'+name);if(!target)return;
      tabs.forEach(tab=>{const selected=tab===target;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;document.getElementById(tab.getAttribute('aria-controls')).hidden=!selected;});
      if(focus)target.focus();
      target.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
      if(updateUrl&&history.replaceState)history.replaceState(null,'','#'+name);
      window.scrollTo({top:document.querySelector('.subnav').offsetTop-4,behavior:'smooth'});
    }
    tabs.forEach((tab,index)=>{
      tab.addEventListener('click',()=>openTab(tab.id.replace('tab-',''),false));
      tab.addEventListener('keydown',event=>{let next=index;if(event.key==='ArrowRight')next=(index+1)%tabs.length;else if(event.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;event.preventDefault();openTab(tabs[next].id.replace('tab-',''));});
    });
    document.querySelectorAll('[data-open-tab]').forEach(button=>button.addEventListener('click',()=>{
      openTab(button.dataset.openTab);
      if(button.dataset.scrollTarget){setTimeout(()=>{
        const destination=document.getElementById(button.dataset.scrollTarget);if(!destination)return;
        destination.scrollIntoView({behavior:'smooth',block:'start'});
        if(destination.id==='complaint-form'){destination.classList.remove('attention');void destination.offsetWidth;destination.classList.add('attention');}
      },220);}
    }));
    const requestedTab=location.hash.slice(1);
    if(requestedTab&&document.getElementById('tab-'+requestedTab))openTab(requestedTab,false,false);
    window.addEventListener('hashchange',()=>{
      const tabName=location.hash.slice(1);
      if(document.getElementById('tab-'+tabName))openTab(tabName,false,false);
    });
    document.getElementById('complaint-iframe').addEventListener('load',event=>event.currentTarget.parentElement.classList.add('is-loaded'));
    document.getElementById('tutorial-poster').addEventListener('click',event=>{
      event.currentTarget.parentElement.innerHTML='<iframe src="https://www.youtube.com/embed/vhc7S8SE8Vs?autoplay=1" title="TUTO 1 DECOF — Premiers pas sur la plateforme" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
    });

    const themeToggle=document.getElementById('theme-toggle');
    const themeIcon=document.getElementById('theme-icon');
    const sunPath='<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    const moonPath='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    function applyTheme(t){document.documentElement.setAttribute('data-theme',t);themeIcon.innerHTML=t==='dark'?sunPath:moonPath;try{localStorage.setItem('jt-theme',t);}catch(e){}}
    let savedTheme='light';try{savedTheme=localStorage.getItem('jt-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}
    applyTheme(savedTheme);
    themeToggle.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
    document.getElementById('print-btn').addEventListener('click',()=>window.print());

    (function fillKpi(){
      document.getElementById('kpi-participants').textContent=PARTICIPANTS.length;
      const pedagogicalParticipants=PARTICIPANTS.filter(p=>/\d+$/.test(p.group));
      document.getElementById('kpi-countries').textContent=new Set(pedagogicalParticipants.map(p=>p.country)).size;
      const groups=new Set(pedagogicalParticipants.map(p=>p.group));
      document.getElementById('kpi-groups').textContent=groups.size;
      const today=new Date();today.setHours(0,0,0,0);
      const allItems=SESSIONS.flatMap(s=>s.items.map(i=>Object.assign({},i,{jt:s.number})));
      const inProgress=allItems.find(i=>new Date(i.start)<=today&&new Date(i.end)>=today);
      const upcoming=allItems.filter(i=>new Date(i.start)>today).sort((a,b)=>new Date(a.start)-new Date(b.start))[0];
      const chosen=inProgress||upcoming;
      const kpiNext=document.getElementById('kpi-next');const kpiSub=document.getElementById('kpi-next-sub');
      const nextBlock=document.getElementById('next-block');
      if(chosen){
        const start=new Date(chosen.start);const diff=Math.ceil((start-today)/(1000*60*60*24));
        if(inProgress){kpiNext.textContent='En cours';kpiSub.textContent='JT '+chosen.jt+' · '+chosen.module;}
        else{kpiNext.textContent='J−'+diff;kpiSub.textContent='avant '+start.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});}
        nextBlock.hidden=false;
        document.getElementById('next-title').textContent='JT '+chosen.jt+' — '+chosen.module+' · '+chosen.section+' — '+chosen.theme;
        document.getElementById('next-when').textContent=chosen.period;
      }else{kpiNext.textContent='Terminé';kpiSub.textContent='cycle 2026 clos';}
    })();

    const sessionsRoot=document.getElementById('sessions');
    SESSIONS.forEach(session=>{
      const article=document.createElement('article');article.className='card session-card';
      const detailId='session-detail-'+session.number;
      const rows=session.items.map(item=>'<tr><td>'+esc(item.period)+'</td><td>'+esc(item.module)+'</td><td>'+esc(item.section)+'</td><td>'+esc(item.theme)+'</td></tr>').join('');
      const modules=Array.from(new Map(session.items.map(item=>[item.module,item.theme])).entries());
      const moduleList='<ul class="module-list" aria-label="Intitulés des modules">'+modules.map(([module,title])=>'<li><strong>'+esc(module)+'</strong> — '+esc(title)+'</li>').join('')+'</ul>';
      article.innerHTML='<span class="badge b">JT '+session.number+'</span><h3>'+esc(session.title)+'</h3><div class="session-meta"><span>'+esc(session.period)+'</span><span>'+session.moduleCount+' modules</span></div>'+moduleList+'<button class="btn secondary small detail-toggle" type="button" aria-expanded="false" aria-controls="'+detailId+'">Voir le calendrier détaillé</button><div class="detail" id="'+detailId+'" hidden><div class="table-wrap"><table><thead><tr><th>Période</th><th>Module</th><th>Section</th><th>Intitulé du module</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
      sessionsRoot.appendChild(article);
    });
    document.querySelectorAll('.detail-toggle').forEach(button=>button.addEventListener('click',()=>{
      const detail=document.getElementById(button.getAttribute('aria-controls'));const opening=detail.hidden;detail.hidden=!opening;
      button.setAttribute('aria-expanded',String(opening));button.textContent=opening?'Masquer le détail':'Voir le détail';
    }));

    const search=document.getElementById('participant-search');
    const results=document.getElementById('participant-results');
    const count=document.getElementById('result-count');
    const filters=document.getElementById('country-filters');
    let activeCountry='ALL';
    const countByCountry={};PARTICIPANTS.forEach(p=>{countByCountry[p.country]=(countByCountry[p.country]||0)+1;});
    const allBtn=document.createElement('button');allBtn.type='button';allBtn.className='chip';allBtn.dataset.country='ALL';allBtn.setAttribute('aria-pressed','true');
    allBtn.innerHTML='<span class="flag-all"></span> Tous les pays <span class="count">'+PARTICIPANTS.length+'</span>';
    filters.appendChild(allBtn);
    Object.entries(COUNTRIES).forEach(([code,meta])=>{
      const btn=document.createElement('button');btn.type='button';btn.className='chip';btn.dataset.country=code;btn.setAttribute('aria-pressed','false');
      btn.innerHTML=flagHtml(code)+' '+esc(meta.label)+' <span class="count">'+(countByCountry[code]||0)+'</span>';
      filters.appendChild(btn);
    });
    filters.querySelectorAll('.chip').forEach(btn=>{
      btn.addEventListener('click',()=>{activeCountry=btn.dataset.country;filters.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));renderParticipants();});
    });
    function normalize(value){return String(value).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[’']/g,"'").trim();}
    function participantCard(p){
      return '<article class="participant"><div class="p-head">'+flagHtml(p.country,'p-flag')+'<div class="name">'+esc(p.lastName)+' '+esc(p.firstName)+'</div></div><dl><dt>Identifiant</dt><dd>'+esc(p.id)+'</dd><dt>Groupe</dt><dd>'+esc(p.group)+'</dd><dt>Pays</dt><dd>'+esc(COUNTRIES[p.country].label)+'</dd></dl></article>';
    }
    function groupBlock(groupName,country,members){
      const cards='<div class="participant-grid">'+members.map(participantCard).join('')+'</div>';
      return '<div class="group-block"><div class="group-head"><div class="g-title">'+flagHtml(country,'g-flag')+esc(groupName)+' <span class="g-count">'+members.length+'</span></div></div>'+cards+'</div>';
    }
    // Natural sort so BENIN 2 < BENIN 10
    function groupSort(a,b){return a.localeCompare(b,'fr',{numeric:true,sensitivity:'base'});}
    function renderParticipants(){
      const term=normalize(search.value);
      const matches=PARTICIPANTS.filter(p=>(activeCountry==='ALL'||p.country===activeCountry)&&(!term||normalize([p.lastName,p.firstName,p.id,p.group,p.country,COUNTRIES[p.country].label].join(' ')).includes(term)));
      count.textContent=matches.length+' participant'+(matches.length>1?'s':'')+' affiché'+(matches.length>1?'s':'')+' sur '+PARTICIPANTS.length;
      results.innerHTML='';
      if(!matches.length){results.innerHTML='<div class="empty">Aucun participant ne correspond à cette recherche.</div>';return;}
      // If a country is selected (not ALL) → hierarchical by group
      if(activeCountry!=='ALL'){
        const byGroup={};matches.forEach(p=>{(byGroup[p.group]=byGroup[p.group]||[]).push(p);});
        const groups=Object.keys(byGroup).sort(groupSort);
        let html='<div class="country-block"><div class="country-title">'+flagHtml(activeCountry,'g-flag')+esc(COUNTRIES[activeCountry].label)+'</div>';
        groups.forEach(g=>{
          byGroup[g].sort((a,b)=>a.lastName.localeCompare(b.lastName,'fr',{sensitivity:'base'}));
          html+=groupBlock(g,activeCountry,byGroup[g]);
        });
        html+='</div>';
        results.innerHTML=html;
        return;
      }
      // ALL selected → group by country then by sub-group
      const byCountry={};matches.forEach(p=>{(byCountry[p.country]=byCountry[p.country]||[]).push(p);});
      const countries=Object.keys(byCountry).sort((a,b)=>COUNTRIES[a].label.localeCompare(COUNTRIES[b].label,'fr'));
      let html='';
      countries.forEach(c=>{
        const list=byCountry[c];
        const byGroup={};list.forEach(p=>{(byGroup[p.group]=byGroup[p.group]||[]).push(p);});
        const groups=Object.keys(byGroup).sort(groupSort);
        html+='<div class="country-block"><div class="country-title">'+flagHtml(c,'g-flag')+esc(COUNTRIES[c].label)+' <span class="g-count" style="font-size:.75rem">'+list.length+'</span></div>';
        groups.forEach(g=>{
          byGroup[g].sort((a,b)=>a.lastName.localeCompare(b.lastName,'fr',{sensitivity:'base'}));
          html+=groupBlock(g,c,byGroup[g]);
        });
        html+='</div>';
      });
      results.innerHTML=html;
    }
    search.addEventListener('input',renderParticipants);
    renderParticipants();

    const lengthInput=document.getElementById('password-length');
    const lengthValue=document.getElementById('length-value');
    const passwordOutput=document.getElementById('password-output');
    const copyStatus=document.getElementById('copy-status');
    lengthInput.addEventListener('input',()=>lengthValue.textContent=lengthInput.value);
    function randomIndex(max){if(max<=0)throw new Error('Ensemble de caractères vide');const limit=Math.floor(4294967296/max)*max;const array=new Uint32Array(1);do{crypto.getRandomValues(array);}while(array[0]>=limit);return array[0]%max;}
    function randomChar(chars){return chars[randomIndex(chars.length)];}
    function secureShuffle(chars){for(let i=chars.length-1;i>0;i--){const j=randomIndex(i+1);[chars[i],chars[j]]=[chars[j],chars[i]];}return chars;}
    function generatePassword(){const sets=[];if(document.getElementById('opt-upper').checked)sets.push('ABCDEFGHJKLMNPQRSTUVWXYZ');if(document.getElementById('opt-lower').checked)sets.push('abcdefghijkmnopqrstuvwxyz');if(document.getElementById('opt-digits').checked)sets.push('23456789');if(document.getElementById('opt-symbols').checked)sets.push('!@#$%&*+-=?');if(!sets.length){passwordOutput.textContent='Sélectionnez au moins une catégorie.';copyStatus.textContent='';return;}const length=Number(lengthInput.value);const all=sets.join('');const chars=sets.map(randomChar);while(chars.length<length)chars.push(randomChar(all));passwordOutput.textContent=secureShuffle(chars).join('');copyStatus.textContent='Mot de passe généré.';}
    document.getElementById('generate-password').addEventListener('click',generatePassword);
    document.getElementById('copy-password').addEventListener('click',async()=>{
      const value=passwordOutput.textContent;
      if(!value||value.startsWith('Cliquez')||value.startsWith('Sélectionnez')){copyStatus.textContent='Générez d’abord un mot de passe.';return;}
      try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);
        else{const area=document.createElement('textarea');area.value=value;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();if(!document.execCommand('copy'))throw new Error('copy failed');area.remove();}
        copyStatus.textContent='Mot de passe copié.';
      }catch(error){copyStatus.textContent='Copie automatique impossible : sélectionnez le mot de passe et copiez-le manuellement.';}
    });
  </script>
